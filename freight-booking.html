<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Freight Marketplace – GetGo Shipper</title>
  <link rel="icon" type="image/png" href="assets/logo.png" />
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <link rel="stylesheet" href="css/base.css" />
  <link rel="stylesheet" href="css/components.css" />
  <link rel="stylesheet" href="css/booking.css" />
  <style>
    #freightMap {
      width: 100%; height: 220px; border-radius: var(--radius-xl);
      overflow: hidden; border: 1px solid var(--color-border);
      margin-bottom: var(--space-lg);
    }
  </style>
</head>
<body>
<div class="app-container">
<div class="page">

  <div class="page-header">
    <a href="home.html" class="header-back">←</a>
    <div class="header-title" data-i18n="freight">Freight Marketplace</div>
    <div style="width:40px;"></div>
  </div>

  <div class="page-content" style="padding:var(--space-lg);">

    <div id="freightMap"></div>

    <div class="form-group mb-md">
      <label class="form-label">Origin City / Hub</label>
      <input type="text" class="form-input" id="originCity" value="Delhi" onchange="updateFreightRoute()" />
    </div>

    <div class="form-group mb-lg">
      <label class="form-label">Destination City / Hub</label>
      <input type="text" class="form-input" id="destCity" value="Mumbai" onchange="updateFreightRoute()" />
    </div>

    <div class="grid-2 mb-lg">
      <div class="form-group">
        <label class="form-label">Cargo Weight (Tons)</label>
        <input type="number" class="form-input" id="cargoTons" value="12" min="1" max="50" />
      </div>
      <div class="form-group">
        <label class="form-label">Container Type</label>
        <select class="form-select" id="containerType">
          <option>Open Truck (22ft - 32ft)</option>
          <option>Closed Container (20ft)</option>
          <option>Closed Container (32ft High Cube)</option>
          <option>Flatbed Trailer</option>
          <option>Refrigerated (Reefer)</option>
        </select>
      </div>
    </div>

    <div class="card mb-lg">
      <div style="font-weight:700;margin-bottom:8px;">Booking Model</div>
      <div class="grid-2">
        <button class="btn btn-outline btn-sm active" id="btnInstant" onclick="setBookingModel('instant')">Instant Rate</button>
        <button class="btn btn-outline btn-sm" id="btnBid" onclick="setBookingModel('bid')">Post to Bidding</button>
      </div>
    </div>

    <button class="btn btn-primary btn-full btn-xl" onclick="proceedFreight()">
      Search Freight Transporters 🏗️
    </button>
  </div>
</div>
</div>

<div id="toast-container"></div>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="js/mock-data.js"></script>
<script src="js/map.js"></script>
<script src="js/app.js"></script>
<script>
  App.applyDarkMode();
  App.requireAuth();

  let bookingModel = 'instant';

  document.addEventListener('DOMContentLoaded', () => {
    GGMap.create('freightMap', { center: [20.5937, 78.9629], zoom: 5 });
    updateFreightRoute();
  });

  function setBookingModel(m) {
    bookingModel = m;
    document.getElementById('btnInstant').classList.toggle('active', m === 'instant');
    document.getElementById('btnBid').classList.toggle('active', m === 'bid');
  }

  async function updateFreightRoute() {
    const orig = document.getElementById('originCity').value;
    const dest = document.getElementById('destCity').value;

    GGMap.clearMarkers('freightMap');
    const oCoords = await GGMap.geocode(orig) || { lat: 28.6139, lng: 77.2090 };
    const dCoords = await GGMap.geocode(dest) || { lat: 19.0760, lng: 72.8777 };

    GGMap.setMarker('freightMap', 'orig', oCoords.lat, oCoords.lng, 'pickup', orig);
    GGMap.setMarker('freightMap', 'dest', dCoords.lat, dCoords.lng, 'drop', dest);
    GGMap.drawRoute('freightMap', [oCoords, dCoords], '#D97706');
  }

  function proceedFreight() {
    const orig = document.getElementById('originCity').value;
    const dest = document.getElementById('destCity').value;
    const tons = document.getElementById('cargoTons').value;

    App.saveBooking({
      serviceType: 'freight',
      pickupAddress: orig,
      stops: [{ address: dest, name: 'Warehouse Incharge', phone: '9876543210', otp: MOCK.generateOTP() }],
      weight: tons * 1000,
      containerType: document.getElementById('containerType').value,
      bookingModel,
    });

    if (bookingModel === 'bid') {
      App.showToast('Freight RFP posted! Transporters will bid shortly.', 'success');
      setTimeout(() => window.location.href = 'my-bookings.html', 1500);
    } else {
      window.location.href = 'vehicle-select.html';
    }
  }
</script>
</body>
</html>
