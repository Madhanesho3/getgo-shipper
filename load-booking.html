<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Load Delivery – GetGo Shipper</title>
  <link rel="icon" type="image/png" href="assets/logo.png" />
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <link rel="stylesheet" href="css/base.css" />
  <link rel="stylesheet" href="css/components.css" />
  <link rel="stylesheet" href="css/booking.css" />
  <style>
    #loadMap {
      width: 100%; height: 200px; border-radius: var(--radius-xl);
      overflow: hidden; border: 1px solid var(--color-border);
      margin-bottom: var(--space-lg);
    }
    .stop-card {
      background: var(--color-surface);
      border: 1px solid var(--color-border);
      border-radius: var(--radius-lg);
      padding: var(--space-md);
      margin-bottom: var(--space-md);
    }
  </style>
</head>
<body>
<div class="app-container">
<div class="page">

  <div class="page-header">
    <a href="home.html" class="header-back">←</a>
    <div class="header-title" data-i18n="load">Load Delivery</div>
    <div style="width:40px;"></div>
  </div>

  <div class="page-content">

    <div class="step-wizard">
      <div class="step-indicators">
        <div class="step-dot active" id="dot-1">1</div>
        <div class="step-line" id="line-1"></div>
        <div class="step-dot" id="dot-2">2</div>
        <div class="step-line" id="line-2"></div>
        <div class="step-dot" id="dot-3">3</div>
      </div>

      <!-- STEP 1: Route & Receivers -->
      <div class="step-content active" id="step-1">
        <div class="tabs">
          <div class="tab-item active" onclick="setDeliveryType('single', this)">Single Destination</div>
          <div class="tab-item" onclick="setDeliveryType('multi', this)">Multi-Drop Route</div>
        </div>

        <div id="loadMap"></div>

        <div class="form-group mb-lg">
          <label class="form-label">📍 Pickup Location <span class="required">*</span></label>
          <input type="text" class="form-input" id="pickupAddr" value="5A, Gandhi Street, Lajpat Nagar, Delhi" onchange="updateMapRoute()" />
        </div>

        <div id="dropsContainer">
          <div class="stop-card">
            <div style="font-weight:700;font-size:var(--font-size-sm);margin-bottom:6px;">🏁 Drop Location 1</div>
            <div class="form-group mb-sm">
              <label class="form-label">Drop Address <span class="required">*</span></label>
              <input type="text" class="form-input stop-address" value="14, Anand Nagar, Sector 12, Noida" onchange="updateMapRoute()" />
            </div>
            <div class="grid-2">
              <div class="form-group">
                <label class="form-label">Receiver Name <span class="required">*</span></label>
                <input type="text" class="form-input stop-name" value="Amit Verma" />
              </div>
              <div class="form-group">
                <label class="form-label">Mobile (for OTP) <span class="required">*</span></label>
                <input type="tel" class="form-input stop-phone" value="9812345678" maxlength="10" />
              </div>
            </div>
          </div>
        </div>

        <button class="btn btn-outline btn-full mb-lg hidden" id="addStopBtn" onclick="addStopInput()">
          + Add Drop Location
        </button>

        <button class="btn btn-primary btn-full btn-xl" onclick="goToStep(2)">
          Continue to Load Details →
        </button>
      </div>

      <!-- STEP 2: Load & Helpers -->
      <div class="step-content" id="step-2">
        <h3 class="mb-lg">Goods & Handling Options</h3>

        <div class="form-group mb-lg">
          <label class="form-label">Category of Goods</label>
          <select class="form-select" id="loadCategory">
            <option>Furniture & Home Décor</option>
            <option>Home Appliances (Fridge, Washing Machine)</option>
            <option>Commercial Machinery & Tools</option>
            <option>Electronics & IT Hardware</option>
            <option>Construction & Hardware Material</option>
            <option>FMCG & Groceries</option>
            <option>Garments & Textiles</option>
          </select>
        </div>

        <div class="form-group mb-lg">
          <label class="form-label">Estimated Weight</label>
          <div class="chips-row">
            <div class="chip active" onclick="setLoadWeight(500, this)">≤ 500 kg</div>
            <div class="chip" onclick="setLoadWeight(1500, this)">≤ 1,500 kg</div>
            <div class="chip" onclick="setLoadWeight(3000, this)">≤ 3,000 kg</div>
            <div class="chip" onclick="setLoadWeight(5000, this)">≤ 5,000 kg</div>
          </div>
        </div>

        <div class="card mb-lg">
          <div style="font-weight:700;margin-bottom:var(--space-sm);">Extra Assistance Options</div>
          <label class="toggle-wrapper" style="border-bottom:1px solid var(--color-border-light);">
            <div>
              <div class="toggle-label">Driver Loading Assistance</div>
              <div class="toggle-desc">+₹99 • Driver helps loading/unloading</div>
            </div>
            <input type="checkbox" id="chkLoading" class="toggle" />
          </label>
          <label class="toggle-wrapper">
            <div>
              <div class="toggle-label">Dedicated Helpers / Labour</div>
              <div class="toggle-desc">+₹149/person • Extra labor crew</div>
            </div>
            <input type="checkbox" id="chkLabour" class="toggle" />
          </label>
        </div>

        <div class="grid-2">
          <button class="btn btn-secondary btn-xl" onclick="goToStep(1)">← Back</button>
          <button class="btn btn-primary btn-xl" onclick="goToStep(3)">Review →</button>
        </div>
      </div>

      <!-- STEP 3: Review -->
      <div class="step-content" id="step-3">
        <h3 class="mb-lg">Review Booking</h3>
        <div class="card mb-lg" id="loadSummary"></div>

        <div class="grid-2">
          <button class="btn btn-secondary btn-xl" onclick="goToStep(2)">← Back</button>
          <button class="btn btn-primary btn-xl" onclick="proceedToVehicleSelect()">Select Truck 🚚</button>
        </div>
      </div>

    </div>
  </div>
</div>
</div>

<div id="toast-container"></div>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="js/mock-data.js"></script>
<script src="js/map.js"></script>
<script src="js/app.js"></script>
<script>
  App.applyDarkMode();
  App.requireAuth();

  let deliveryType = 'single';
  let stopCount = 1;
  let loadWeight = 500;

  document.addEventListener('DOMContentLoaded', () => {
    GGMap.create('loadMap', { center: [28.5677, 77.2437], zoom: 12 });
    updateMapRoute();
  });

  function setDeliveryType(type, el) {
    deliveryType = type;
    document.querySelectorAll('.tabs .tab-item').forEach(t => t.classList.remove('active'));
    el.classList.add('active');
    document.getElementById('addStopBtn').classList.toggle('hidden', type === 'single');
    updateMapRoute();
  }

  function addStopInput() {
    stopCount++;
    const container = document.getElementById('dropsContainer');
    const div = document.createElement('div');
    div.className = 'stop-card';
    div.innerHTML = `
      <div style="font-weight:700;font-size:var(--font-size-sm);margin-bottom:6px;">🏁 Drop Location ${stopCount}</div>
      <div class="form-group mb-sm">
        <label class="form-label">Drop Address <span class="required">*</span></label>
        <input type="text" class="form-input stop-address" placeholder="Enter drop address" onchange="updateMapRoute()" />
      </div>
      <div class="grid-2">
        <div class="form-group">
          <label class="form-label">Receiver Name <span class="required">*</span></label>
          <input type="text" class="form-input stop-name" placeholder="Name" />
        </div>
        <div class="form-group">
          <label class="form-label">Mobile (for OTP) <span class="required">*</span></label>
          <input type="tel" class="form-input stop-phone" placeholder="10-digit mobile" maxlength="10" />
        </div>
      </div>
    `;
    container.appendChild(div);
  }

  async function updateMapRoute() {
    const pickup = document.getElementById('pickupAddr').value;
    const stops = Array.from(document.querySelectorAll('.stop-address')).map(i => i.value).filter(Boolean);

    GGMap.clearMarkers('loadMap');
    const pCoords = await GGMap.geocode(pickup) || { lat: 28.5677, lng: 77.2437 };
    GGMap.setMarker('loadMap', 'pickup', pCoords.lat, pCoords.lng, 'pickup', 'Pickup');

    const points = [pCoords];
    for (let i = 0; i < stops.length; i++) {
      const coords = await GGMap.geocode(stops[i]);
      if (coords) {
        GGMap.setMarker('loadMap', `drop_${i}`, coords.lat, coords.lng, 'drop', `Drop ${i+1}`);
        points.push(coords);
      }
    }
    if (points.length >= 2) GGMap.drawRoute('loadMap', points);
  }

  function setLoadWeight(w, el) {
    loadWeight = w;
    document.querySelectorAll('.chips-row .chip').forEach(c => c.classList.remove('active'));
    el.classList.add('active');
  }

  function goToStep(s) {
    document.querySelectorAll('.step-dot').forEach((d, i) => {
      d.classList.toggle('active', i + 1 === s);
      d.classList.toggle('done', i + 1 < s);
    });
    document.querySelectorAll('.step-line').forEach((l, i) => {
      l.classList.toggle('done', i + 1 < s);
    });
    document.querySelectorAll('.step-content').forEach((c, i) => {
      c.classList.toggle('active', i + 1 === s);
    });

    if (s === 3) {
      const stops = Array.from(document.querySelectorAll('.stop-card')).map(card => ({
        address: card.querySelector('.stop-address').value,
        name: card.querySelector('.stop-name').value,
        phone: card.querySelector('.stop-phone').value,
        otp: MOCK.generateOTP(),
      }));
      document.getElementById('loadSummary').innerHTML = `
        📍 <strong>Pickup:</strong> ${document.getElementById('pickupAddr').value}<br/>
        🏁 <strong>Stops:</strong> ${stops.length} location(s)<br/>
        📦 <strong>Goods:</strong> ${document.getElementById('loadCategory').value} (≤ ${loadWeight} kg)<br/>
        💪 <strong>Assistance:</strong> ${document.getElementById('chkLoading').checked ? 'Loading Assist' : 'None'}, ${document.getElementById('chkLabour').checked ? 'Helpers' : 'No Helpers'}
      `;
    }
  }

  function proceedToVehicleSelect() {
    const stops = Array.from(document.querySelectorAll('.stop-card')).map(card => ({
      address: card.querySelector('.stop-address').value,
      name: card.querySelector('.stop-name').value,
      phone: card.querySelector('.stop-phone').value,
      otp: MOCK.generateOTP(),
    }));

    App.saveBooking({
      serviceType: 'load',
      deliveryType,
      pickupAddress: document.getElementById('pickupAddr').value,
      stops,
      goodsCategory: document.getElementById('loadCategory').value,
      weight: loadWeight,
      loadingAssist: document.getElementById('chkLoading').checked,
      labourAssist: document.getElementById('chkLabour').checked,
    });

    window.location.href = 'vehicle-select.html';
  }
</script>
</body>
</html>
