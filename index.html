<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="description" content="GetGo Shipper – The ultimate transport network for India. Book bikes, trucks & freight instantly." />
  <title>GetGo Shipper – Logistics Marketplace</title>
  <link rel="icon" type="image/png" href="assets/logo.png" />
  <link rel="stylesheet" href="css/base.css" />
  <link rel="stylesheet" href="css/auth.css" />
</head>
<body>
  <div class="app-container">
    <div class="splash-page">
      <div class="splash-circles">
        <div class="splash-circle"></div>
        <div class="splash-circle"></div>
        <div class="splash-circle"></div>
      </div>

      <div class="splash-brand">
        <div style="font-size:72px; margin-bottom:8px;">🚛</div>
        <div class="splash-app-name">Get<span>Go</span></div>
        <div class="splash-app-name" style="font-size:28px; font-weight:700; letter-spacing:8px; color:rgba(255,255,255,0.9); margin-top:-4px;">SHIPPER</div>
        <div class="splash-tagline">The ultimate transport network for India</div>
      </div>

      <div class="splash-loader">
        <div class="splash-progress">
          <div class="splash-progress-bar" id="progressBar"></div>
        </div>
        <div class="splash-version">v2.4.1</div>
      </div>
    </div>
  </div>

  <script src="js/mock-data.js"></script>
  <script src="js/app.js"></script>
  <script>
    // Apply dark mode immediately
    App.applyDarkMode();

    // Redirect after splash
    window.addEventListener('DOMContentLoaded', () => {
      setTimeout(() => {
        if (App.isLoggedIn()) {
          window.location.href = 'home.html';
        } else {
          window.location.href = 'login.html';
        }
      }, 2400);
    });
  </script>
</body>
</html>
