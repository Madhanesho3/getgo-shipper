name: Build Android APK & Create Release

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Prepare Web Assets for Android
        run: |
          mkdir -p android/app/src/main/assets
          cp -r *.html css js assets android/app/src/main/assets/

      - name: Build Android APK
        run: |
          cd android
          chmod +x gradlew || true
          gradle assembleDebug

      - name: Rename APK
        run: |
          mkdir -p build-output
          cp android/app/build/outputs/apk/debug/app-debug.apk build-output/GetGo-Shipper.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: GetGo-Shipper-APK
          path: build-output/GetGo-Shipper.apk

      - name: Create Release & Upload APK
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: v1.0.0
          name: GetGo Shipper App v1.0.0
          body: |
            🚚 **GetGo Shipper Android App (APK)**
            
            Download and install the official Android APK directly on your mobile device!
            
            **Features Included:**
            - Full Parcel, Load & Freight Booking
            - Real-Time Leaflet.js Live Tracking
            - Multi-Drop Receiver OTP Verification
            - 10 Indian Languages & Dark Mode
          draft: false
          prerelease: false
          files: build-output/GetGo-Shipper.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
