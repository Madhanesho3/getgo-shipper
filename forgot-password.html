<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Forgot Password – GetGo Shipper</title>
  <link rel="icon" type="image/png" href="assets/logo.png" />
  <link rel="stylesheet" href="css/base.css" />
  <link rel="stylesheet" href="css/components.css" />
  <link rel="stylesheet" href="css/auth.css" />
</head>
<body>
<div class="app-container">
  <div class="auth-page">
    <div class="auth-hero" style="min-height:160px; padding-bottom:60px;">
      <a href="login.html" class="header-back" style="position:absolute;top:20px;left:16px;color:white;opacity:0.9;">←</a>
      <h1 class="auth-hero-title">Reset <span>Password</span></h1>
      <svg class="auth-hero-wave" viewBox="0 0 430 40" xmlns="http://www.w3.org/2000/svg">
        <path d="M0 40 Q107 0 215 20 Q323 40 430 0 L430 40 Z" fill="var(--color-bg)" />
      </svg>
    </div>

    <div class="auth-body animate-fade-in-up">
      <!-- Step 1: Enter email/phone -->
      <div id="fpStep1">
        <div class="otp-page-icon">🔑</div>
        <h2 class="auth-title" style="text-align:center;">Forgot Password?</h2>
        <p class="auth-subtitle" style="text-align:center; margin-bottom:var(--space-2xl);">Enter your registered email or mobile number. We'll send a reset OTP.</p>
        <div class="auth-form">
          <div class="form-group">
            <label class="form-label">Email or Mobile <span class="required">*</span></label>
            <div class="input-wrapper">
              <span class="input-icon-left">📧</span>
              <input type="text" id="fpInput" class="form-input has-icon-left" placeholder="email@example.com or 9876543210" />
            </div>
          </div>
          <button class="btn btn-primary btn-full btn-xl" onclick="sendFpOTP()">Send OTP →</button>
          <a href="login.html" class="btn btn-secondary btn-full btn-lg" style="margin-top:0;">Back to Login</a>
        </div>
      </div>

      <!-- Step 2: OTP -->
      <div id="fpStep2" class="hidden">
        <div class="otp-page-icon">📱</div>
        <h2 class="auth-title" style="text-align:center;">Enter OTP</h2>
        <p class="auth-subtitle" style="text-align:center; margin-bottom:var(--space-2xl);">We sent a 6-digit OTP to your registered contact.</p>
        <div class="auth-form">
          <div class="otp-inputs" id="fpOtpInputs">
            <input class="otp-box" maxlength="1" type="tel" />
            <input class="otp-box" maxlength="1" type="tel" />
            <input class="otp-box" maxlength="1" type="tel" />
            <input class="otp-box" maxlength="1" type="tel" />
            <input class="otp-box" maxlength="1" type="tel" />
            <input class="otp-box" maxlength="1" type="tel" />
          </div>
          <div class="otp-timer">Demo OTP: <strong style="color:var(--color-primary);">654321</strong></div>
          <button class="btn btn-primary btn-full btn-xl" onclick="verifyFpOTP()">Verify OTP →</button>
        </div>
      </div>

      <!-- Step 3: New Password -->
      <div id="fpStep3" class="hidden">
        <div class="otp-page-icon">🔒</div>
        <h2 class="auth-title" style="text-align:center;">New Password</h2>
        <p class="auth-subtitle" style="text-align:center; margin-bottom:var(--space-2xl);">Create a new secure password for your account.</p>
        <div class="auth-form">
          <div class="form-group">
            <label class="form-label">New Password <span class="required">*</span></label>
            <div class="input-wrapper">
              <span class="input-icon-left">🔒</span>
              <input type="password" id="newPwd" class="form-input has-icon-left has-icon-right" placeholder="Min. 8 characters" />
              <span class="input-icon-right" onclick="toggleNewPwd()">👁️</span>
            </div>
          </div>
          <div class="form-group">
            <label class="form-label">Confirm Password <span class="required">*</span></label>
            <div class="input-wrapper">
              <span class="input-icon-left">🔒</span>
              <input type="password" id="confirmNewPwd" class="form-input has-icon-left" placeholder="Re-enter password" />
            </div>
          </div>
          <button class="btn btn-primary btn-full btn-xl" onclick="resetPassword()">Reset Password ✓</button>
        </div>
      </div>
    </div>
  </div>
</div>

<div id="toast-container"></div>
<script src="js/mock-data.js"></script>
<script src="js/app.js"></script>
<script>
  App.applyDarkMode();

  function sendFpOTP() {
    const val = document.getElementById('fpInput').value.trim();
    if (!val) { App.showToast('Enter your email or mobile number', 'error'); return; }
    App.showToast('OTP sent successfully!', 'success');
    document.getElementById('fpStep1').classList.add('hidden');
    document.getElementById('fpStep2').classList.remove('hidden');
    setTimeout(() => document.querySelector('#fpOtpInputs .otp-box').focus(), 100);

    // OTP auto-advance
    document.querySelectorAll('#fpOtpInputs .otp-box').forEach((box, i, all) => {
      box.addEventListener('input', () => { if (box.value && i < all.length - 1) all[i + 1].focus(); });
      box.addEventListener('keydown', e => { if (e.key === 'Backspace' && !box.value && i > 0) all[i - 1].focus(); });
    });
  }

  function verifyFpOTP() {
    const otp = Array.from(document.querySelectorAll('#fpOtpInputs .otp-box')).map(b => b.value).join('');
    if (otp.length < 6) { App.showToast('Enter the 6-digit OTP', 'error'); return; }
    if (otp !== '654321') { App.showToast('Invalid OTP. Try 654321', 'error'); return; }
    document.getElementById('fpStep2').classList.add('hidden');
    document.getElementById('fpStep3').classList.remove('hidden');
  }

  function toggleNewPwd() {
    const el = document.getElementById('newPwd');
    el.type = el.type === 'password' ? 'text' : 'password';
  }

  function resetPassword() {
    const pwd = document.getElementById('newPwd').value;
    const confirm = document.getElementById('confirmNewPwd').value;
    if (pwd.length < 8) { App.showToast('Password must be at least 8 characters', 'error'); return; }
    if (pwd !== confirm) { App.showToast('Passwords do not match', 'error'); return; }
    App.showToast('Password reset successful! Please login.', 'success');
    setTimeout(() => window.location.href = 'login.html', 1500);
  }
</script>
</body>
</html>
