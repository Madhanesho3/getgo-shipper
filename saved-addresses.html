<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Saved Addresses – GetGo Shipper</title>
  <link rel="icon" type="image/png" href="assets/logo.png" />
  <link rel="stylesheet" href="css/base.css" />
  <link rel="stylesheet" href="css/components.css" />
  <link rel="stylesheet" href="css/profile.css" />
</head>
<body>
<div class="app-container">
<div class="page">

  <div class="page-header">
    <a href="profile.html" class="header-back">←</a>
    <div class="header-title">Saved Addresses</div>
    <button onclick="showAddAddress()" style="font-size:22px;background:none;border:none;cursor:pointer;color:var(--color-primary);padding:var(--space-sm);">+</button>
  </div>

  <div class="page-content">
    <div style="padding:var(--space-lg);">

      <!-- Address list -->
      <div id="addressList"></div>

      <!-- Add New -->
      <button class="btn btn-outline btn-full btn-lg" onclick="showAddAddress()" style="margin-top:var(--space-lg);">
        + Add New Address
      </button>

      <!-- Recent -->
      <div style="margin-top:var(--space-3xl);">
        <div class="section-title" style="margin-bottom:var(--space-md);">📍 Recent Locations</div>
        <div id="recentList"></div>
      </div>
    </div>
  </div>
</div>
</div>

<!-- Add Address Sheet -->
<div class="overlay" id="addAddrOverlay" onclick="closeAddAddress()"></div>
<div class="bottom-sheet" id="addAddrSheet">
  <div class="bottom-sheet-handle"></div>
  <div style="padding:var(--space-lg) var(--space-xl) var(--space-3xl);">
    <h3 style="margin-bottom:var(--space-xl);" id="addrSheetTitle">Add New Address</h3>
    <div class="flex-col gap-lg">
      <div class="form-group">
        <label class="form-label">Label</label>
        <div style="display:flex;gap:var(--space-sm);flex-wrap:wrap;margin-bottom:var(--space-sm);">
          <button class="chip active" onclick="setLabel('🏠 Home',this)">🏠 Home</button>
          <button class="chip" onclick="setLabel('🏢 Office',this)">🏢 Office</button>
          <button class="chip" onclick="setLabel('⭐ Favourite',this)">⭐ Favourite</button>
          <button class="chip" onclick="setLabel('👨‍👩‍👧 Family',this)">👨‍👩‍👧 Family</button>
        </div>
        <input type="text" class="form-input" id="addrLabel" placeholder="Custom label" value="🏠 Home" />
      </div>
      <div class="form-group">
        <label class="form-label">Full Address <span class="required">*</span></label>
        <textarea class="form-input form-textarea" id="addrText" placeholder="House/flat no., street, area, city, pincode"></textarea>
      </div>
      <div class="form-group">
        <label class="form-label">Landmark (optional)</label>
        <input type="text" class="form-input" id="addrLandmark" placeholder="Near metro, temple, etc." />
      </div>
      <button class="btn btn-primary btn-full btn-xl" onclick="saveAddress()">Save Address ✓</button>
    </div>
  </div>
</div>

<div id="toast-container"></div>
<script src="js/mock-data.js"></script>
<script src="js/app.js"></script>
<script>
  App.applyDarkMode();
  App.requireAuth();

  let addresses = [...MOCK.user.savedAddresses];

  document.addEventListener('DOMContentLoaded', () => {
    renderAddresses();
    renderRecent();
  });

  function renderAddresses() {
    const list = document.getElementById('addressList');
    list.innerHTML = '';
    if (!addresses.length) {
      list.innerHTML = '<div class="empty-state" style="padding:var(--space-3xl) 0;"><div class="empty-state-icon">📭</div><div class="empty-state-title">No saved addresses</div><div class="empty-state-desc">Add your home, office, or frequent locations.</div></div>';
      return;
    }
    addresses.forEach((addr, i) => {
      const card = document.createElement('div');
      card.className = 'address-card';
      card.innerHTML = `
        <div class="address-icon">${addr.icon}</div>
        <div class="address-info">
          <div class="address-label">${addr.label}</div>
          <div class="address-text">${addr.address}</div>
        </div>
        <div class="address-actions">
          <button class="address-action-btn" onclick="event.stopPropagation();editAddress(${i})" title="Edit">✏️</button>
          <button class="address-action-btn" onclick="event.stopPropagation();deleteAddress(${i})" title="Delete">🗑️</button>
        </div>
      `;
      card.onclick = () => {
        App.saveBooking({ pickupAddress: addr.address });
        App.showToast('Address selected as pickup!', 'success');
      };
      list.appendChild(card);
    });
  }

  function renderRecent() {
    const list = document.getElementById('recentList');
    MOCK.recentLocations.forEach(loc => {
      const el = document.createElement('div');
      el.className = 'list-item';
      el.innerHTML = `
        <div class="list-item-icon">${loc.icon}</div>
        <div class="list-item-content">
          <div class="list-item-title">${loc.label}</div>
          <div class="list-item-desc">${loc.address}</div>
        </div>
        <button onclick="event.stopPropagation();saveRecent('${loc.label}','${loc.address}')" style="background:none;border:none;cursor:pointer;color:var(--color-primary);font-size:18px;" title="Save">💾</button>
      `;
      list.appendChild(el);
    });
  }

  function showAddAddress() {
    document.getElementById('addrSheetTitle').textContent = 'Add New Address';
    document.getElementById('addrLabel').value = '🏠 Home';
    document.getElementById('addrText').value = '';
    document.getElementById('addrLandmark').value = '';
    document.getElementById('addAddrOverlay').classList.add('show');
    document.getElementById('addAddrSheet').classList.add('show');
  }

  function closeAddAddress() {
    document.getElementById('addAddrOverlay').classList.remove('show');
    document.getElementById('addAddrSheet').classList.remove('show');
  }

  function setLabel(label, btn) {
    document.querySelectorAll('#addAddrSheet .chip').forEach(c => c.classList.remove('active'));
    btn.classList.add('active');
    document.getElementById('addrLabel').value = label;
  }

  function saveAddress() {
    const label = document.getElementById('addrLabel').value.trim();
    const text = document.getElementById('addrText').value.trim();
    if (!label || !text) { App.showToast('Fill in the label and address', 'error'); return; }
    const parts = label.split(' ');
    const icon = parts[0].match(/\p{Emoji}/u) ? parts[0] : '📍';
    const lbl = parts.slice(1).join(' ') || label;
    addresses.push({ id: 'addr' + Date.now(), label: lbl, icon, address: text });
    renderAddresses();
    closeAddAddress();
    App.showToast('Address saved!', 'success');
  }

  function editAddress(i) {
    const addr = addresses[i];
    document.getElementById('addrSheetTitle').textContent = 'Edit Address';
    document.getElementById('addrLabel').value = addr.icon + ' ' + addr.label;
    document.getElementById('addrText').value = addr.address;
    document.getElementById('addAddrOverlay').classList.add('show');
    document.getElementById('addAddrSheet').classList.add('show');
  }

  function deleteAddress(i) {
    if (confirm('Remove this address?')) {
      addresses.splice(i, 1);
      renderAddresses();
      App.showToast('Address removed', 'info');
    }
  }

  function saveRecent(label, address) {
    addresses.push({ id: 'addr' + Date.now(), label, icon: '📍', address });
    renderAddresses();
    App.showToast('"' + label + '" saved!', 'success');
  }
</script>
</body>
</html>
