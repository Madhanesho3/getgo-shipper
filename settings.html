<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Settings – GetGo Shipper</title>
  <link rel="icon" type="image/png" href="assets/logo.png" />
  <link rel="stylesheet" href="css/base.css" />
  <link rel="stylesheet" href="css/components.css" />
  <link rel="stylesheet" href="css/profile.css" />
  <style>
    .lang-item-card {
      display: flex; align-items: center; justify-content: space-between;
      padding: var(--space-md) var(--space-lg);
      border: 1.5px solid var(--color-border);
      border-radius: var(--radius-lg);
      margin-bottom: var(--space-sm);
      cursor: pointer; background: var(--color-surface);
      transition: all var(--transition-base);
    }
    .lang-item-card.active {
      border-color: var(--color-primary);
      background: var(--color-primary-light);
    }
  </style>
</head>
<body>
<div class="app-container">
<div class="page">

  <div class="page-header">
    <a href="profile.html" class="header-back">←</a>
    <div class="header-title" data-i18n="settings">Settings</div>
    <div style="width:40px;"></div>
  </div>

  <div class="page-content" style="padding:var(--space-lg);">

    <!-- Appearance / Dark Mode Section -->
    <div class="settings-section">
      <div class="settings-section-title">Appearance</div>

      <div class="settings-item">
        <div class="settings-item-left">
          <div class="settings-item-icon">🌙</div>
          <div>
            <div class="settings-item-title" data-i18n="dark_mode">Dark Mode</div>
            <div class="settings-item-desc">Available inside Settings only</div>
          </div>
        </div>
        <label class="toggle">
          <input type="checkbox" id="darkModeToggle" onchange="handleDarkMode(this)" />
          <div class="toggle-slider"></div>
        </label>
      </div>

      <div class="settings-item" onclick="showLanguagePicker()">
        <div class="settings-item-left">
          <div class="settings-item-icon">🌐</div>
          <div>
            <div class="settings-item-title" data-i18n="language">Language</div>
            <div class="settings-item-desc" id="currentLangLabel">English</div>
          </div>
        </div>
        <div style="color:var(--color-text-muted);">›</div>
      </div>
    </div>

    <!-- Notifications Section -->
    <div class="settings-section">
      <div class="settings-section-title" data-i18n="notifications">Notifications</div>

      <div class="settings-item">
        <div class="settings-item-left">
          <div class="settings-item-icon">📦</div>
          <div><div class="settings-item-title">Booking Updates</div></div>
        </div>
        <label class="toggle"><input type="checkbox" checked /><div class="toggle-slider"></div></label>
      </div>

      <div class="settings-item">
        <div class="settings-item-left">
          <div class="settings-item-icon">💳</div>
          <div><div class="settings-item-title">Payment & Wallet Alerts</div></div>
        </div>
        <label class="toggle"><input type="checkbox" checked /><div class="toggle-slider"></div></label>
      </div>
    </div>

    <!-- About Section -->
    <div class="settings-section">
      <div class="settings-section-title">About App</div>
      <div class="settings-item">
        <div class="settings-item-left">
          <div class="settings-item-icon">ℹ️</div>
          <div>
            <div class="settings-item-title">GetGo Shipper</div>
            <div class="settings-item-desc">Version 3.0.0 (Pro)</div>
          </div>
        </div>
      </div>
    </div>

  </div>
</div>
</div>

<!-- Language Picker Modal Sheet -->
<div class="overlay" id="langOverlay" onclick="closeLang()"></div>
<div class="bottom-sheet" id="langSheet">
  <div class="bottom-sheet-handle"></div>
  <div style="padding:var(--space-lg) var(--space-xl) var(--space-3xl);">
    <h3 style="margin-bottom:var(--space-md);">Select App Language</h3>
    <div id="languagesContainer"></div>
  </div>
</div>

<div id="toast-container"></div>
<script src="js/mock-data.js"></script>
<script src="js/app.js"></script>
<script>
  App.applyDarkMode();
  App.requireAuth();

  document.addEventListener('DOMContentLoaded', () => {
    document.getElementById('darkModeToggle').checked = App.isDarkMode();
    updateLangDisplay();
    renderLanguageList();
  });

  function handleDarkMode(toggle) {
    App.setDarkMode(toggle.checked);
    App.showToast(toggle.checked ? '🌙 Dark Mode Enabled' : '☀️ Light Mode Enabled', 'success');
  }

  function updateLangDisplay() {
    const cur = App.getLang();
    const lObj = MOCK.languages.find(l => l.code === cur) || MOCK.languages[0];
    document.getElementById('currentLangLabel').textContent = `${lObj.native} (${lObj.name})`;
  }

  function renderLanguageList() {
    const container = document.getElementById('languagesContainer');
    container.innerHTML = '';
    const cur = App.getLang();

    MOCK.languages.forEach(l => {
      const card = document.createElement('div');
      card.className = `lang-item-card ${l.code === cur ? 'active' : ''}`;
      card.onclick = () => selectLanguage(l.code);
      card.innerHTML = `
        <div style="display:flex;align-items:center;gap:12px;">
          <span style="font-size:22px;">${l.flag}</span>
          <div>
            <div style="font-weight:700;font-size:var(--font-size-base);">${l.native}</div>
            <div style="font-size:var(--font-size-xs);color:var(--color-text-secondary);">${l.name}</div>
          </div>
        </div>
        ${l.code === cur ? '<span style="color:var(--color-primary);font-weight:800;">✓</span>' : ''}
      `;
      container.appendChild(card);
    });
  }

  function showLanguagePicker() {
    document.getElementById('langOverlay').classList.add('show');
    document.getElementById('langSheet').classList.add('show');
  }

  function closeLang() {
    document.getElementById('langOverlay').classList.remove('show');
    document.getElementById('langSheet').classList.remove('show');
  }

  function selectLanguage(code) {
    App.setLang(code);
    updateLangDisplay();
    renderLanguageList();
    closeLang();
    App.showToast(`Language updated successfully!`, 'success');
  }
</script>
</body>
</html>
